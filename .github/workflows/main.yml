name: Front-End CI Production

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    inputs:
      SVC_ID:
        required: true
        type: string
    secrets:
      API_KEY:
        required: true
      RAILWAY_TOKEN:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      SVC_ID: ${{ inputs.SVC_ID || vars.RAILWAY_SERVICE_ID }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: 5TheLoneWolf5/EDDS_PB_TP3
          ref: main

      - name: Verify context
        run: railway status
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}

      - name: Deploy
        run: |
          railway up --service=${{ env.SVC_ID }}
        env:
          RAILWAY_TOKEN: ${{ env.RAILWAY_TOKEN }}
